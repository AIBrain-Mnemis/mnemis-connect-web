name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: [self-hosted, linux]
    environment: production
    # workflow_run fires regardless of CI outcome; gate on success here.
    # workflow_dispatch has no triggering run, so allow it through too.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        env:
          # Backend URL the browser bundle will call.
          # Set repo Variable VITE_API_BASE_URL (Settings → Secrets and variables → Actions → Variables).
          # Leave unset to use same-origin (requires a reverse proxy for /rtc on the web host).
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Publish dist/ to web root
        env:
          # Absolute path on the deploy host where built assets should land.
          # Set repo Variable DEPLOY_TARGET_DIR (e.g. /var/www/example.com/dist).
          TARGET_DIR: ${{ vars.DEPLOY_TARGET_DIR }}
        run: |
          if [ -z "$TARGET_DIR" ]; then
            echo "::error::DEPLOY_TARGET_DIR repo variable is not set." >&2
            exit 1
          fi
          mkdir -p "$TARGET_DIR"
          rsync -a --delete dist/ "$TARGET_DIR/"
